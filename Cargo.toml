[package]
name = "slsf"
version = "0.1.0"
edition = "2021"
authors = ["hz-xiaxz hzxiaxz@gmail.com"]
license = "MIT"

[dependencies]
clap = { version = "4", features = ["derive"] }
hdf5-pure = "0.20"
rand = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

[dev-dependencies]
approx = "0.5"

[profile.profiling]
inherits = "release"
debug = true
strip = false
