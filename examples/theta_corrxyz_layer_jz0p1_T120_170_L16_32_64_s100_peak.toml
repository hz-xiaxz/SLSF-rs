name = "theta_corrxyz_layer_jz0p1_T120_170_L16_32_64_s100_peak"
output_dir = "runs/theta_corrxyz_layer_jz0p1_T120_170_L16_32_64_s100_peak"
checkpoint = true
run_time = "48:00:00"
checkpoint_time = "00:30:00"

[model]
# Layer-resolved XY correlations, z correlations, and stiffness around the
# size-independent specific-heat maximum (T ~ 1.3) and up to where rho_z
# vanishes (T ~ 1.6-1.7) in the wide scan.  Goal: decide whether the peak is
# the J=1 layers losing in-plane order inside a still 3D-coupled stack
# (ordered J=2 layers embedded in disordered J=1 layers) or the onset of a
# sliding regime.
L = [16, 32, 64]
T = [1.2, 1.25, 1.3, 1.35, 1.4, 1.45, 1.5, 1.55, 1.6, 1.7]
samples = 100
base_seed = 20260911

j_xy = 1.5
delta_j_xy = [0.5]
j_z = 0.1
delta_j_z = [0.0]

[run]
sweeps = 200000
thermalization = 100000
binsize = 1000
proposal_width = 3.141592653589793
wolff_steps = 1

[measure]
corr_rmax_xy = [8, 16, 32]
corr_rmax_z = [8, 16, 32]
correlation_interval = 10
