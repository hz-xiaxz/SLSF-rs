name = "hb_probe_L32_s4"
output_dir = "runs/hb_probe_L32_s4"
checkpoint = true
run_time = "02:00:00"
checkpoint_time = "00:30:00"

[model]
# Heartbeat-cost probe: production-like per-sweep cost (L=32, layer-resolved
# correlations every 10 sweeps) but only 25k sweeps per task.
L = [32]
T = [1.3]
samples = 4
base_seed = 20260914

j_xy = 1.5
delta_j_xy = [0.5]
j_z = 0.1
delta_j_z = [0.0]

[run]
sweeps = 20000
thermalization = 5000
binsize = 1000
proposal_width = 3.141592653589793
wolff_steps = 1

[measure]
corr_rmax_xy = [16]
corr_rmax_z = [16]
correlation_interval = 10
