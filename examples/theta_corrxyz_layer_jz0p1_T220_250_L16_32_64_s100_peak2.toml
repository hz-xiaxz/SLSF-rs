[model]
# Second specific-heat maximum (T ~ 2.33 in the coarse T=2.25-3.0 scan), where
# rho_XY collapses.  Layer-resolved XY correlations, z correlations and
# stiffness to see whether this is the J=2 layers' (KT-like or 3D) transition.
L = [16, 32, 64]
T = [2.2, 2.25, 2.3, 2.325, 2.35, 2.375, 2.4, 2.45, 2.5]
samples = 100
base_seed = 20260912

j_xy = 1.5
delta_j_xy = [0.5]
j_z = 0.1
delta_j_z = [0.0]

[run]
sweeps = 200000
thermalization = 100000
binsize = 1000
proposal_width = 3.141592653589793
wolff_steps = 1

[measure]
corr_rmax_xy = [8, 16, 32]
corr_rmax_z = [8, 16, 32]
correlation_interval = 10
